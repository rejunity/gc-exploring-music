[project]
name = "evomusic"
version = "0.0.1"
description = "Evolutionary generation of MIDI melodies with a composite fitness: music-theory rules, corpus statistics, a learned critic, and human feedback."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "mido>=1.3",
    "symusic>=0.5",
]

[project.optional-dependencies]
analysis = ["music21>=9.1", "pandas>=2.2", "matplotlib>=3.8", "jupyterlab>=4"]
critic = ["torch>=2.6"]
# independent grader: Anticipatory Music Transformer (Stanford CRFM, trained on Lakh MIDI)
amt = ["torch>=2.6", "transformers>=4.40", "anticipation @ git+https://github.com/jthickstun/anticipation.git@main", "tqdm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["evomusic"]

# GTX 1080 (Pascal, sm_61): use the CUDA 12.6 wheels, which still ship Pascal kernels.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
