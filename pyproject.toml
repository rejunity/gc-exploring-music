[project]
name = "evomusic"
version = "0.0.1"
description = "Evolutionary generation of MIDI melodies with a composite fitness: music-theory rules, corpus statistics, a learned critic, and human feedback."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "mido>=1.3",
    "symusic>=0.5",
]

[project.optional-dependencies]
analysis = ["music21>=9.1", "pandas>=2.2", "matplotlib>=3.8", "jupyterlab>=4"]
critic = ["torch>=2.3", "miditok>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evomusic"]
